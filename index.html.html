<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geriatric Nursing Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
        .option-btn:disabled { cursor: not-allowed; }
        
        /* Clear background picture without blur */
        .bg-custom-image {
            /* Light semi-transparent overlay (0.4 opacity) so text stays legible while image remains crisp */
            background-image: linear-gradient(rgba(248, 250, 252, 0.4), rgba(248, 250, 252, 0.4)), 
                              url('file:///D:/FILE%20TEST/file%20test%20html/photo_2026-07-26_19-41-02.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        @keyframes subtle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-subtle {
            animation: subtle-bounce 3s infinite ease-in-out;
        }
    </style>
</head>
<body id="app-body" class="bg-custom-image min-h-screen flex flex-col items-center justify-center p-4 transition-all duration-500">

    <!-- Top Text Banner Header -->
    <div class="mb-6 z-10 text-center animate-subtle">
        <div class="inline-flex items-center gap-2 bg-white/90 px-6 py-2.5 rounded-full shadow-lg border border-pink-200">
            <span class="text-base sm:text-lg md:text-xl font-bold text-pink-600 tracking-wide">
                រៀនមិនចេះមកនេះមកថើបមួយ😗❤
            </span>
        </div>
    </div>

    <!-- Quiz Main Card (Removed backdrop-blur) -->
    <div id="quiz-container" class="bg-white/90 rounded-2xl shadow-xl p-6 sm:p-8 w-full max-w-2xl border-t-8 border-blue-600 transition-all border border-gray-100">
        <!-- Progress Bar & Question Info -->
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-100">
            <span id="progress-text" class="text-sm font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">សំណួរទី 1/77</span>
            <button onclick="toggleRandomize()" class="text-xs sm:text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-lg transition">
                🔀 <span id="random-status">ចៃដន្យ (Auto Random: ON)</span>
            </button>
        </div>

        <!-- Question Header -->
        <h2 id="question-text" class="text-lg sm:text-xl font-bold text-gray-800 mb-6 leading-relaxed">
            សំណួរ...
        </h2>

        <!-- Options Container -->
        <div id="options-grid" class="space-y-3 mb-6">
            <!-- Options will be injected here -->
        </div>

        <!-- Feedback Area -->
        <div id="feedback-area" class="hidden text-center p-4 rounded-xl mb-6">
            <p id="feedback-msg" class="text-2xl font-bold mb-2"></p>
            <p id="correct-answer-display" class="text-gray-700 font-medium"></p>
        </div>

        <div class="flex justify-end">
            <button id="next-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-8 rounded-xl shadow-lg transition duration-200">
                បន្ទាប់
            </button>
        </div>
    </div>

    <!-- Result Screen (Removed backdrop-blur) -->
    <div id="result-container" class="hidden bg-white/90 rounded-2xl shadow-xl p-8 w-full max-w-md text-center border-t-8 border-green-500">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">លទ្ធផលរបស់អ្នក</h2>
        <div class="text-5xl font-bold text-blue-600 mb-6" id="final-score">0 / 77</div>
        <button onclick="restartQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-10 rounded-full shadow-lg transition duration-200">
            ធ្វើឡើងវិញ
        </button>
    </div>

    <script>
        const quizData = [
            { q: "តើការផ្លាស់ប្តូរអ្វីនៅក្នុងប្រព័ន្ធតម្រងនោមដែលទាក់ទងនឹងអាយុ?", a: ["អត្រាចម្រោះឈាមកើនឡើង (GFR)", "ទំហំតម្រងនោមកើនឡើង", "ចំនួន Nephron មុខងារថយចុះ", "មុខងារតម្រងនោមប្រសើរឡើង"], c: 2 },
            { q: "នៅអាយុ 70 ឆ្នាំ តើមុខងារតម្រងនោមថយចុះប្រហាក់ប្រហែលប៉ុន្មានភាគរយ ?", a: ["20%", "50%", "70%", "80%"], c: 1 },
            { q: "តើអ្វីជាការផ្លាស់ប្តូរទូទៅនៅក្នុងប្រព័ន្ធទឹកនោមនៅពេលមនុស្សចាស់?", a: ["សមត្ថភាពប្លោកនោមកើនឡើង", "ការកើនឡើងការផលិតទឹកនោម", "ការថយចុះចំនួនដងនៃការនោម", "ការថយចុះសាច់ដុំប្លោកនោម"], c: 3 },
            { q: "តើអ្វីជាការផ្លាស់ប្តូរសាច់ដុំនិងគ្រោងឆ្អឹងទូទៅនៅពេលដល់វ័យចំណាស់?", a: ["ដង់ស៊ីតេឆ្អឹងកើនឡើង", "ការបាត់បង់ភាពបត់បែនរួមគ្នា", "ម៉ាសសាច់ដុំកើនឡើង", "ភាពប្រសើរឡើងនៃចលនារួមគ្នា"], c: 1 },
            { q: "តើការផ្លាស់ប្តូរអ័រម៉ូនមួយណាដែលកើតឡើងជាធម្មតានៃភាពចាស់?", a: ["ការកើនឡើងការផលិតអ័រម៉ូនទីរ៉ូអ៊ីត", "ការកើនឡើងការបញ្ចេញអ័រម៉ូនAdrenal", "ការកើនឡើងការផលិតអ័រម៉ូនអាំងស៊ុយលីន", "ការថយចុះការបញ្ចេញអ័រម៉ូនលូតលាស់"], c: 3 },
            { q: "យោងតាមទ្រឹស្តីនៃភាពជាប់លាប់ (continuity theory ) តើមនុស្សវ័យចំណាស់មានភាពចាស់ដោយជោគជ័យនៅពេលណា?", a: ["ដកខ្លួនចេញពីសកម្មភាពទាំងអស់", "ផ្តោតលើការជួសជុលជីវសាស្ត្រ", "រក្សាទម្លាប់និងតួនាទីដែលជាប់លាប់", "ផ្លាស់ប្តូររចនាសម្ព័ន្ធសង្គមទាំងមូលរបស់ពួកគេ"], c: 2 },
            { q: "តើទ្រឹស្តីចិត្តសង្គម (psychosocial theories)នៃការចាស់ជរាផ្ដោតសំខាន់លើអ្វី?", a: ["មេកានិចនៃភាពចាស់ខាងរាងកាយ", "តួនាទីសង្គម អាកប្បកិរិយា និងទំនាក់ទំនង", "ការទទួលទានរបបអាហារ", "ការថយចុះអ័រម៉ូន"], c: 1 },
            { q: "តើទ្រឹស្តីនៃការភ្ជាប់ (Cross-linking theory) ពន្យល់ពីភាពចាស់តាមរយៈអ្វី?", a: ["បញ្ហាផ្លូវចិត្ត និងការប្រែប្រូលជាលិកាស្បែក", "ការផ្លាស់ប្តូរហ្សែន និង ការប្រែប្រូលទម្ងន់រាងកាយ", "ការប្រមូលផ្តុំនៃការខូចខាតប្រូតេអ៊ីន និងជាលិកាឡើងរឹង", "កង្វះវីតាមីន និងការថយចុះការឃ្លានអាហារ"], c: 2 },
            { q: "អ្នកបានប្រើទ្រឹស្តីសកម្មភាពក្នុងការរៀបចំផែនការថែទាំ។ តើសកម្មភាពមួយណាខាងក្រោមដែលបង្ហាញពីវិធីសាស្រ្តនេះបានល្អជាងគេ?", a: ["ការលើកទឹកចិត្តអ្នកជំងឺឱ្យបន្តថែទាំខ្លួន", "ការកំណត់សកម្មភាពរាងកាយរបស់អ្នកជំងឺ", "ការណែនាំឱ្យដកខ្លួនចេញពីក្លឹបសង្គម", "ការជៀសវាងកាលវិភាគដែលមានរចនាសម្ព័ន្ធស្មុកស្មាញ"], c: 0 },
            { q: "ក្នុងការអនុវត្តទ្រឹស្តីកម្មវិធី(programmed theory) តើអន្តរាគមន៍អាទិភាពអ្វីខ្លះដែលគិលានុបដ្ឋាកត្រូវផ្តល់?", a: ["ការត្រួតពិនិត្យរបួសចៃដន្យ", "គាំទ្រការជួសជុលកោសិកា និងការត្រួតពិនិត្យសុខភាពជាប្រចាំ", "ការលើកទឹកចិត្តក្នុងការចូលរួមព្រឹត្តិការណ៍សង្គមពេលយប់ជ្រៅ", "ការកាត់បន្ថយការអប់រំអាហារូបត្ថម្ភ"], c: 1 },
            { q: "បុរសអាយុ 72 ឆ្នាំម្នាក់ អាចបន្តធ្វើសកម្មភាពសង្គម ដូចជា ចូលរួមសកម្មភាពសហគមន៍ និងថែសួនជុំវិញផ្ទះគាត់បានធម្មតា ហើយគាត់មានអារម្មណ៍ពេញចិត្តជីវិតរស់នៅបែននេះ។ តើទ្រឹស្តីណាមួយខាងក្រោមដែលអាចពន្យល់អំពីស្ថានភាពនេះបានល្អបំផុត?", a: ["Disengagement theory", "Wear-and-tear theory", "Activity theory", "Free radical theory"], c: 2 },
            { q: "ក្នុងការអនុវត្តទ្រឹស្តីកម្មវិធី(programmed theory) តើអន្តរាគមន៍អាទិភាពអ្វីខ្លះដែលគិលានុបដ្ឋាកត្រូវផ្តល់?", a: ["ការត្រួតពិនិត្យរបួសចៃដន្យ", "គាំទ្រការជួសជុលកោសិកា និងការត្រួតពិនិត្យសុខភាពជាប្រចាំ", "ការលើកទឹកចិត្តក្នុងការចូលរួមព្រឹត្តិការណ៍សង្គមពេលយប់ជ្រៅ", "ការកាត់បន្ថយការអប់រំអាហារូបត្ថម្ភ"], c: 1 },
            { q: "អ្នកជំងឺជាមនុស្សចាស់ម្នាក់និយាយថា «ខ្ញុំចង់បន្តរស់នៅតាមទម្លាប់ដដែល ដូចពេលខ្ញុំធ្លាប់ធ្វើពីមុន»។ តើការថែទាំរបស់អ្នកដែលសមស្របបំផុតគួរផ្អែកលើទ្រឹស្តីណា?", a: ["Disengagement theory", "Continuity theory", "Programmed theory", "Error theory"], c: 1 },
            { q: "អ្នកកំពុងរៀបចំផែនការថែទាំសម្រាប់មនុស្សចាស់ម្នាក់ ដែលមានទំនោរដកខ្លួនចេញពីសង្គម និងចូលចិត្តនៅស្ងៀមស្ងាត់ម្នាក់ឯង។ បើផ្អែកលើ Disengagement theory តើសកម្មភាពណាខាងក្រោមសមស្របជាងគេ?", a: ["គាំទ្រការដកខ្លួនតាមជម្រើសអ្នកជំងឺ", "បង្ខំឲ្យចូលរួមសកម្មភាពសង្គម", "បង្កើនការងាររាងកាយ", "ផ្លាស់ប្តូរទម្លាប់រចនាសម្ព័ន្ធរស់នៅទាំងស្រុង"], c: 0 },
            { q: "អ្នកជំងឺវ័យចំណាស់ម្នាក់រាយការណ៍ពីការលំបាកក្នុងការធ្វើចលនា និងការឈឺសន្លាក់។ តើការផ្លាស់ប្តូរទាក់ទងនឹងអាយុមួយណាដែលទំនងជាបណ្តាលឱ្យមានបញ្ហានេះ?", a: ["ដង់ស៊ីតេឆ្អឹងកើនឡើង", "ការកើនឡើងកម្លាំង និងមុខងារសាច់ដុំ", "ការថយចុះជាតិខ្លាញ់ក្នុងខ្លួន និងភាពប្រសើរឡើងនៃសាច់ដុំ", "ការបាត់បង់ភាពបត់បែនរួមគ្នា និងម៉ាសសាច់ដុំ"], c: 3 },
            { q: "អ្នកកំពុងវាយតម្លៃមនុស្សវ័យចំណាស់ម្នាក់ ហើយកត់សម្គាល់ឃើញការលំបាកក្នុងការចងចាំព្រឹត្តិការណ៍ថ្មីៗ ប៉ុន្តែអ្នកជំងឺអាចនឹកឃើញព្រឹត្តិការណ៍កន្លងមក។ តើអ្វីទៅជាលក្ខខណ្ឌដែលទំនងបំផុត?", a: ["ជំងឺAlzheimer", "ខ្សោយការយល់ដឹងកម្រិតស្រាល", "ជំងឺសរសៃឈាម", "ជំងឺផាកឃីនសាន់"], c: 1 },

            { q: "តើហេតុអ្វីការអប់រំសុខភាពសម្រាប់មនុស្សចាស់ ត្រូវធ្វើជាបន្តបន្ទាប់?", a: ["ព្រោះមនុស្សចាស់ចូលចិត្តស្តាប់", "ព្រោះមានការថយចុះចងចាំ", "ព្រោះមានពេលទំនេរច្រើន", "ព្រោះជាការងារគិលានុបដ្ឋាក"], c: 1 },

            { q: "ហេតុអ្វីការប្រាស្រ័យទាក់ទងជាមួយគ្រួសារ មានសារៈសំខាន់ក្នុង end-of-life care?", a: ["ដើម្បីឲ្យគ្រួសារសហការ និងគាំទ្រ", "ដើម្បីកាត់បន្ថយការងារបុគ្គលិក", "ដើម្បីជួយគ្រួសារឱ្យយល់ និងសម្រេចចិត្តត្រឹមត្រូវ", "ដើម្បីបំពេញឯកសារ"], c: 2 },
            { q: "តើការអប់រំសុខភាពសម្រាប់មនុស្សចាស់ ខុសពីមនុស្សវ័យក្មេងយ៉ាងដូចម្តេច?", a: ["ប្រើភាសាស្មុគស្មាញ", "ប្រើពេលវេលាតិច", "សមត្ថភាពយល់ដឹង និងបទពិសោធន៍ជីវិត", "មិនចាំបាច់អប់រំច្រើន និងប្រើពេលតិច"], c: 2 },
            { q: "Spiritual care ក្នុងការថែទាំដំណាក់កាលចុងក្រោយ មានន័យដូចម្តេច?", a: ["ការអធិស្ឋានតែប៉ុណ្ណោះ", "ការគាំទ្រជំនឿ និងអត្ថន័យជីវិត", "ការប្រើឱសថសម្រួលអារម្មណ៍", "ការនិយាយតិច និងការផ្តល់ក្តីសង្ឃឹម"], c: 1 },
            { q: "ហេតុអ្វី pain assessment នៅមនុស្សចាស់ ត្រូវប្រុងប្រយ័ត្នជាងមុន?", a: ["ព្រោះឈឺតិចមានលក្ខណៈរ៉ាំរ៉ៃ", "ព្រោះមិនចាំបាច់វាស់វែងច្រើន", "ព្រោះអាចពិពណ៌នាមិនច្បាស់", "ព្រោះថ្នាំគ្រប់គ្រាន់"], c: 2 },

            { q: "លោកតា អាយុ 79 ឆ្នាំ មានជំងឺទឹកនោមផ្អែម និងលើសសម្ពាធឈាម។ នៅពេលពិនិត្យមុនចេញពីមន្ទីរពេទ្យ គាត់និយាយថា គាត់ច្រឡំពេលវេលាទទួលថ្នាំ និងមិនប្រាកដថាត្រូវធ្វើអ្វីបន្តនៅផ្ទះ។ គ្រួសាររបស់គាត់ក៏មិនសូវយល់ច្បាស់ដែរ។ តើសកម្មភាពណារបស់អ្នកសមស្របបំផុតក្នុងស្ថានភាពនេះ?", a: ["បន្តផ្តល់ថ្នាំតាមវេជ្ជបញ្ជាដដែល និងប្តូរឥរិយាបទ", "ពន្យារពេលការអប់រំទៅថ្ងៃបន្ទាប់", "ស្នើឲ្យគ្រួសារសម្រេចការថែទាំដោយខ្លួនឯង", "ផ្តល់ការអប់រំសុខភាពដោយប្រើភាសាងាយ និងពេលវេលាសមស្រប"], c: 3 },
            { q: "លោកយាយ អាយុ 83 ឆ្នាំ កំពុងទទួល palliative care នៅផ្ទះ។ គ្រួសារបង្ហាញការព្រួយបារម្ភថា ការប្រើឱសថបំបាត់ការឈឺចាប់អាចធ្វើឲ្យគាត់ញៀន ឬបង្កគ្រោះថ្នាក់។ គ្រួសារសួរអ្នកថាតើគួរបន្តឱសថ ឬអត់។ តើការអនុវត្តណាសមស្របបំផុត?", a: ["កាត់បន្ថយថ្នាំដោយមិនត្រូវការពន្យល់ច្រើននាំឱ្យគាត់ច្រឡំ", "ពន្យល់អំពីគោលបំណង និងការប្រើថ្នាំដោយសុវត្ថិភាព", "ជៀសវាងការពិភាក្សាអំពីថ្នាំច្រើន នាំឱ្យភ្លេច", "បញ្ឈប់ថ្នាំរង់ចាំការឈឺធូរ"], c: 1 },
            { q: "អ្នកជំងឺមនុស្សចាស់មានជំងឺភ្លេចភ្លាំងបង្ហាញអាកប្បកិរិយាប្រែប្រួល។ គ្រួសារមានការខឹង និងគិតថាអ្នកជំងឺ 'ធ្វើដោយចេតនា'។ តើអ្នកគួរធ្វើអ្វីដើម្បីគាំទ្រការថែទាំ?", a: ["អប់រំគ្រួសារអំពីស្ថានភាពជំងឺ និងការថែទាំប្រចាំថ្ងៃ", "ផ្តោតតែការផ្តល់ថ្នាំបំបាត់អាកប្បកិរិយា", "កាត់បន្ថយការទំនាក់ទំនងជាមួយគ្រួសារ", "ស្នើឲ្យគ្រួសារផ្លាស់ទីអ្នកជំងឺ"], c: 0 },
            { q: "អ្នកជំងឺម្នាក់ស្ថិតក្នុងដំណាក់កាលចុងក្រោយបាត់បង់ចំណង់អាហារ និងញុំាបានតិច។ គ្រួសារភ័យខ្លាចថា អ្នកជំងឺនឹងខ្សោយ ហើយសួរថាតើត្រូវបង្ខំឲ្យញុំាឬអត់។ តើសកម្មភាពណាសមស្របបំផុត?", a: ["បង្ខំឲ្យញុំាដើម្បីរក្សាថាមពល", "បញ្ឈប់ការថែទាំអាហារ", "ផ្តល់អាហារតាមបំពង់ភ្លាម និងផ្តល់ឱសថសម្រួលអារម្មណ៍", "អប់រំគ្រួសារអំពីការផ្តល់អាហារតិចៗ និងផ្តល់ការថែទាំចុងក្រោយ"], c: 3 },
            { q: "ក្នុងការថែទាំ end-of-life care គ្រួសារមិនព្រមទទួល palliative care ទោះអ្នកជំងឺមានការឈឺចាប់ខ្លាំង។ តើមូលហេតុណាអាចពាក់ព័ន្ធជាងគេដែលអ្នកគួរវិភាគ?", a: ["ការយល់ច្រឡំអំពីគោលបំណង palliative care", "ការខ្វះសម្ភារៈថែទាំ", "អាយុ និងជំងឺរបស់អ្នកជំងឺ", "ការគ្មានបុគ្គលិកគ្រប់គ្រាន់"], c: 0 },
            { q: "គ្រួសារមានការភ័យខ្លាចខ្លាំងចំពោះ opioid នៅក្នុង palliative care ទោះបានពន្យល់ម្តងហើយម្តងទៀត។ តើអ្នកគួរវិភាគបញ្ហានេះយ៉ាងដូចម្តេច?", a: ["ជាបញ្ហាផលប៉ះពាល់ថ្នាំ", "ជាបញ្ហាខ្វះការយល់ដឹង និងជំនឿខុស", "ជាបញ្ហាអាយុអ្នកជំងឺ", "ជាបញ្ហាថ្នាំមិនគ្រប់គ្រាន់"], c: 1 },
            { q: "ការប្រាស្រ័យទាក់ទងជាមួយគ្រួសារមិនមានប្រសិទ្ធភាពក្នុង end-of-life care។ តើកត្តាណាអាចពាក់ព័ន្ធបំផុតដែលត្រូវវិភាគ?", a: ["ភាសា អារម្មណ៍ និងស្ថានភាពផ្លូវចិត្ត", "ចំនួនគ្រែ និងបរិយាកាស", "ពេលវេលាធ្វើការរបស់បុគ្គលិក", "ការផ្គត់ផ្គង់ឧបករណ៍"], c: 0 },
            { q: "បន្ទាប់ពីការអប់រំសុខភាព អ្នកជំងឺអាចអនុវត្ត self-care នៅផ្ទះបានត្រឹមត្រូវ និងមានការកែលម្អសុខភាព។ តើអ្វីបង្ហាញថាការអប់រំមានប្រសិទ្ធភាព?", a: ["គិលានុបដ្ឋាយិកាបានបំពេញការងារ", "លទ្ធផលសុខភាពល្អឡើង និងបង្ហាញការអនុវត្ត", "មានឯកសារកត់ត្រាអប់រំ", "ប្រើពេលវេលាអប់រំច្រើន និងបង្ហាញការអនុវត្ត"], c: 1 },
            { q: "គ្រួសារអាចពន្យល់វិញបានច្បាស់អំពីការផ្លាស់ប្តូរពេលជិតស្លាប់ និងការថែទាំត្រឹមត្រូវ។ តើនេះបង្ហាញអ្វី?", a: ["គ្រួសារយល់ដោយខ្លួនឯង", "ពេលវេលាថែទាំគ្រប់", "អ្នកជំងឺមានជំងឺយូរ", "ការអប់រំសុខភាពមានគុណភាព"], c: 3 },
            { q: "អ្នកជំងឺ end-of-life ម្នាក់មានភាពស្ងប់ស្ងាត់ និងទទួលយកស្ថានភាពរបស់ខ្លួន។ តើអ្នកគួរវាយតម្លៃលទ្ធផលនេះយ៉ាងដូចម្តេច?", a: ["ជាលទ្ធផល holistic care និង spiritual support", "ជាលទ្ធផលនៃការប្រើឱសថសម្រួលអារម្មណ៍", "ជាលទ្ធផលអាយុខ្ពស់", "ជាលទ្ធផលនៃសំណាង"], c: 0 },
            { q: "អ្នកជំងឺ និងគ្រួសារបង្ហាញភាពពេញចិត្តចំពោះការថែទាំដំណាក់កាលចុងក្រោយនៃជីវិត។ តើវាសំដៅទៅលើអ្វី?", a: ["ការថែទាំល្អ", "ការថែទាំមានគុណភាព", "ពេលវេលាសម្រាកគ្រប់គ្រាន់", "ការផ្តល់ឱសថបានត្រឹមត្រូវ"], c: 1 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let isRandom = true;
        let activeQuestions = [];

        // DOM Element references
        const appBody = document.getElementById('app-body');
        const quizContainer = document.getElementById('quiz-container');
        const progressText = document.getElementById('progress-text');
        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackMsg = document.getElementById('feedback-msg');
        const correctAnswerDisplay = document.getElementById('correct-answer-display');
        const nextBtn = document.getElementById('next-btn');
        const resultContainer = document.getElementById('result-container');
        const finalScore = document.getElementById('final-score');

        // Fisher-Yates Shuffle Algorithm
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Prepare questions and randomize choices
        function prepareQuestions() {
            let list = isRandom ? shuffleArray(quizData) : [...quizData];
            return list.map(item => {
                if (!isRandom) return { ...item, a: [...item.a] };
                
                const indexedOpts = item.a.map((optText, idx) => ({ text: optText, isCorrect: idx === item.c }));
                const shuffledOpts = shuffleArray(indexedOpts);
                const newCorrectIdx = shuffledOpts.findIndex(o => o.isCorrect);

                return {
                    q: item.q,
                    a: shuffledOpts.map(o => o.text),
                    c: newCorrectIdx
                };
            });
        }

        function toggleRandomize() {
            isRandom = !isRandom;
            const statusEl = document.getElementById('random-status');
            if (statusEl) {
                statusEl.innerText = isRandom ? 'ចៃដន្យ (Auto Random: ON)' : 'តាមលំដាប់ (Sequential: OFF)';
            }
            restartQuiz();
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            activeQuestions = prepareQuestions();
            quizContainer.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if (!activeQuestions || activeQuestions.length === 0) {
                activeQuestions = prepareQuestions();
            }

            const qData = activeQuestions[currentQuestion];
            progressText.innerText = `សំណួរទី ${currentQuestion + 1}/${activeQuestions.length}`;
            questionText.innerText = `${currentQuestion + 1}. ${qData.q}`;
            
            optionsGrid.innerHTML = '';
            const labels = ['ក', 'ខ', 'គ', 'ឃ'];
            
            qData.a.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-3.5 sm:p-4 rounded-xl border-2 border-gray-100 bg-white/80 hover:bg-blue-50 hover:border-blue-300 transition duration-200 flex items-center shadow-sm";
                btn.innerHTML = `<span class="bg-gray-100 px-3 py-1 rounded-lg mr-3 font-bold text-gray-700 flex-shrink-0">${labels[index]}</span> <span>${option}</span>`;
                btn.onclick = () => selectOption(index);
                optionsGrid.appendChild(btn);
            });

            feedbackArea.className = "hidden text-center p-4 rounded-xl mb-6";
            nextBtn.classList.add('hidden');
        }

        function selectOption(index) {
            const qData = activeQuestions[currentQuestion];
            const correct = qData.c;
            const buttons = optionsGrid.querySelectorAll('button');

            buttons.forEach(btn => btn.disabled = true);

            feedbackArea.classList.remove('hidden');

            if (index === correct) {
                score++;
                feedbackMsg.innerText = "ត្រូវហើយ! ✅";
                feedbackMsg.className = "text-2xl font-bold mb-1 text-green-600";
                feedbackArea.classList.add('bg-green-50', 'border', 'border-green-200');
                buttons[index].classList.remove('border-gray-100', 'bg-white/80');
                buttons[index].classList.add('border-green-500', 'bg-green-50');
                correctAnswerDisplay.innerText = "";
            } else {
                feedbackMsg.innerText = "ខុសហើយ! ❌";
                feedbackMsg.className = "text-2xl font-bold mb-1 text-red-600";
                feedbackArea.classList.add('bg-red-50', 'border', 'border-red-200');
                buttons[index].classList.remove('border-gray-100', 'bg-white/80');
                buttons[index].classList.add('border-red-500', 'bg-red-50');
                
                const labels = ['ក', 'ខ', 'គ', 'ឃ'];
                correctAnswerDisplay.innerText = `ចម្លើយត្រឹមត្រូវគឺ៖ ${labels[correct]}. ${qData.a[correct]}`;
                buttons[correct].classList.add('border-green-500', 'bg-green-50');
            }

            nextBtn.classList.remove('hidden');
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < activeQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            finalScore.innerText = `${score} / ${activeQuestions.length}`;
        }

        // Initialize quiz
        restartQuiz();
    </script>
